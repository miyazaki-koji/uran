<style type="text/css">
html	{ background: #121212; }
body	{ background: #FFF; font-weight: bold; }
a	{ color: #2D88B3; }
#page	{
	width: 100%;
}
	#page > div	{
		min-width: 1000px;
	}
#header	{
	width: 100%;
	background: #121212;
	padding: 30px 0;
	font-size: 180%;
	color: #FFF;
	text-align: center;
}
#container	{
	width: 100%;
	display: -webkit-box;
	display: -moz-box;
}
	#container > div	{
		padding: 20px;
		min-height: 500px;
		box-sizing: content-box;
	}
#leftBox	{

float: left;

	width: 250px;
	background: #999;
	-webkit-box-ordinal-group: 1;
	-moz-box-ordinal-group: 1;
	border-right: 2px solid #09F;
	border-left: 2px solid #09F;
	-webkit-box-sizing: border-box;
	-moz-box-sizing: border-box;
	-ms-box-sizing: border-box;
	box-sizing: border-box;
}
#main	{
	-webkit-box-flex: 1;
	-moz-box-flex: 1;
	min-width: 500px;
	background: #EEE;
	-webkit-box-ordinal-group: 2;
	-moz-box-ordinal-group: 2;
	position: relative;
}
#main p	{
	position: absolute;
	right: 20px;
	bottom: 20px;
}


#rightBox	{
float: right;

	width: 250px;
	background: #666;
	-webkit-box-ordinal-group: 3;
	-moz-box-ordinal-group: 3;
}
#footer	{
	width: 100%;
	background: #121212;
	padding: 10px 0;
	color: #FFF;
	text-align: center;
}
.copyright	{ font-family: Arial, Helvetica, sans-serif; }

</style>
